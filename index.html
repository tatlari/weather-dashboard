<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داشبورد هواشناسی من</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="weather-container">
    
        <!-- بخش نمایش اطلاعات (فعلاً با دیتای فیک) -->
        <div class="weather-info">
            <h2 id="city-name">تهران</h2>
            <div class="temp"><span id="temperature">25</span>°C</div>
            <div class="description" id="weather-desc">آسمان صاف</div>
            <div class="details">
                <p>رطوبت: <span id="humidity">40</span>%</p>
                <p>باد: <span id="wind-speed">12</span> کیلومتر بر ساعت</p>
            </div>
            <div class="search-box">
            <input type="text" id="city-input" placeholder="اسم شهر رو وارد کن (مثلا Tehran)...">
            <button id="search-btn">جستجو</button>
        </div>
    
        <p id="error-message" style="color: #ff4757; font-size: 0.9rem; display: none;"></p>
        <img id="weather-icon" src="" alt="icon" style="display: none; margin: 0 auto;">
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
